<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Known Sky: Audio Lab</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/src/game/styles.css" />
    <style>
      html, body { height: auto; min-height: 100%; overflow-x: hidden; overflow-y: auto; }
      body.lab {
        background:
          radial-gradient(1100px 520px at 72% -12%, rgba(127, 212, 255, 0.11), transparent 62%),
          radial-gradient(900px 520px at -12% 112%, rgba(196, 155, 255, 0.09), transparent 60%),
          var(--ks-bg);
      }
      body.lab::before {
        content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
        background-image:
          linear-gradient(rgba(127, 212, 255, 0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(127, 212, 255, 0.04) 1px, transparent 1px);
        background-size: 28px 28px;
        -webkit-mask-image: radial-gradient(ellipse at 50% 30%, #000 20%, transparent 75%);
        mask-image: radial-gradient(ellipse at 50% 30%, #000 20%, transparent 75%);
      }
      .lab canvas { display: block; width: 100%; height: 100%; }
      .lab-wrap { position: relative; z-index: 1; max-width: 1320px; margin: 0 auto; padding: 14px 16px 28px; }

      .lab-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 12px; flex-wrap: wrap; }
      .lab-title { display: flex; align-items: center; gap: 12px; min-width: 0; }
      .lab-mark { width: 30px; height: 30px; flex: none; }
      .lab-title h1 { margin: 0; font-weight: 300; font-size: 1.05rem; letter-spacing: 0.34em; text-transform: uppercase; white-space: nowrap; }
      .lab-title h1 .accent { color: var(--ks-accent); }
      .lab-title p { margin: 2px 0 0; color: var(--ks-dim); font-size: 0.74rem; line-height: 1.35; }
      .lab-actions { display: flex; align-items: center; gap: 10px; }

      .btn-start {
        font: 600 0.78rem var(--ks-font); letter-spacing: 0.14em; text-transform: uppercase; cursor: pointer;
        color: #02121c; background: linear-gradient(180deg, #a6e4ff, var(--ks-accent)); border: 0; border-radius: 999px;
        padding: 9px 18px; box-shadow: 0 0 0 1px rgba(127, 212, 255, 0.5), 0 0 22px rgba(127, 212, 255, 0.45);
        transition: transform 0.15s ease, box-shadow 0.2s ease, opacity 0.3s ease;
      }
      .btn-start:hover { transform: translateY(-1px); box-shadow: 0 0 0 1px rgba(127, 212, 255, 0.7), 0 0 30px rgba(127, 212, 255, 0.6); }
      .btn-start[hidden] { display: none; }
      .pill {
        font: 0.66rem var(--ks-mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ks-dim);
        border: 1px solid var(--ks-border); border-radius: 999px; padding: 5px 11px; display: inline-flex; align-items: center; gap: 7px;
      }
      .pill::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--ks-dim); opacity: 0.6; }
      .pill.on { color: var(--ks-accent); border-color: rgba(127, 212, 255, 0.6); }
      .pill.on::before { background: var(--ks-accent); opacity: 1; box-shadow: 0 0 8px var(--ks-accent); animation: pulse 2.4s ease-in-out infinite; }
      @keyframes pulse { 50% { opacity: 0.45; } }

      .grid { display: grid; gap: 12px; grid-template-columns: 1fr; grid-template-areas: 'main' 'state' 'side'; }
      @media (min-width: 760px) { .grid { grid-template-columns: 236px minmax(0, 1fr); grid-template-areas: 'state main' 'side main'; align-items: start; } }
      @media (min-width: 1140px) { .grid { grid-template-columns: 250px minmax(0, 1fr) 270px; grid-template-areas: 'state main side'; } }
      .col { display: grid; gap: 12px; align-content: start; min-width: 0; }
      .col-state { grid-area: state; }
      .col-main { grid-area: main; }
      .col-side { grid-area: side; }

      .panel {
        position: relative; overflow: hidden; padding: 10px 12px 12px; border-radius: 10px;
        background: linear-gradient(180deg, rgba(14, 30, 54, 0.62), var(--ks-panel)); border: 1px solid var(--ks-border);
        -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04), 0 10px 30px rgba(0, 0, 0, 0.35);
      }
      .panel::after {
        content: ''; position: absolute; left: 10%; right: 10%; top: 0; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(127, 212, 255, 0.7), transparent);
      }
      .panel h2 {
        display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin: 0 0 8px;
        font: 600 0.64rem var(--ks-mono); letter-spacing: 0.18em; text-transform: uppercase; color: var(--ks-dim);
      }
      .panel h2 .meta { font-weight: 400; letter-spacing: 0.06em; text-transform: none; color: var(--ks-accent); }

      .ctl { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 3px 8px; margin: 2px 0 8px; }
      .ctl label { font-size: 0.75rem; color: var(--ks-fg); }
      .ctl output { font: 0.68rem var(--ks-mono); color: var(--ks-accent); }
      .ctl input[type='range'] { grid-column: 1 / -1; }
      input[type='range'] {
        -webkit-appearance: none; appearance: none; width: 100%; height: 16px; margin: 0; background: transparent; cursor: pointer; --p: 0%;
      }
      input[type='range']::-webkit-slider-runnable-track {
        height: 3px; border-radius: 3px;
        background: linear-gradient(90deg, var(--ks-accent) 0, var(--ks-accent) var(--p), rgba(138, 160, 192, 0.25) var(--p));
        box-shadow: 0 0 6px rgba(127, 212, 255, 0.25);
      }
      input[type='range']::-moz-range-track { height: 3px; border-radius: 3px; background: rgba(138, 160, 192, 0.25); }
      input[type='range']::-moz-range-progress { height: 3px; border-radius: 3px; background: var(--ks-accent); }
      input[type='range']::-webkit-slider-thumb {
        -webkit-appearance: none; width: 12px; height: 12px; margin-top: -4.5px; border-radius: 50%;
        background: #e8f7ff; border: 2px solid var(--ks-accent); box-shadow: 0 0 10px rgba(127, 212, 255, 0.8);
      }
      input[type='range']::-moz-range-thumb { width: 10px; height: 10px; border-radius: 50%; background: #e8f7ff; border: 2px solid var(--ks-accent); }
      input:focus-visible, button:focus-visible { outline: 2px solid var(--ks-accent); outline-offset: 2px; }

      .seg { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; margin: 4px 0 10px; }
      .chip-btn, .cue-btn, .seg button {
        font: 0.7rem var(--ks-font); color: var(--ks-fg); cursor: pointer; text-align: left;
        background: rgba(127, 212, 255, 0.05); border: 1px solid rgba(127, 212, 255, 0.18); border-radius: 6px; padding: 6px 8px;
        transition: background 0.15s ease, border-color 0.15s ease, box-shadow 0.25s ease;
      }
      .seg button { text-align: center; }
      .chip-btn:hover, .cue-btn:hover, .seg button:hover { background: rgba(127, 212, 255, 0.12); border-color: rgba(127, 212, 255, 0.45); }
      .seg button[aria-pressed='true'] { background: rgba(127, 212, 255, 0.18); border-color: var(--ks-accent); color: #fff; box-shadow: 0 0 12px rgba(127, 212, 255, 0.3); }
      .toggles { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 4px; }
      .toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 0.75rem; cursor: pointer; user-select: none; }
      .toggle input { -webkit-appearance: none; appearance: none; width: 28px; height: 16px; border-radius: 999px; margin: 0; cursor: pointer; position: relative;
        background: rgba(138, 160, 192, 0.25); border: 1px solid rgba(127, 212, 255, 0.25); transition: background 0.2s ease; }
      .toggle input::after { content: ''; position: absolute; top: 2px; left: 2px; width: 10px; height: 10px; border-radius: 50%; background: #cfe6ff; transition: transform 0.2s ease; }
      .toggle input:checked { background: rgba(127, 212, 255, 0.45); border-color: var(--ks-accent); }
      .toggle input:checked::after { transform: translateX(12px); background: #fff; box-shadow: 0 0 8px var(--ks-accent); }
      .row-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 10px; }
      .chip-btn { text-align: center; }

      .cues { display: grid; grid-template-columns: repeat(2, 1fr); gap: 5px; }
      .cue-btn { display: flex; align-items: center; gap: 7px; }
      .cue-btn i { width: 6px; height: 6px; border-radius: 50%; flex: none; background: rgba(127, 212, 255, 0.35); transition: background 0.2s, box-shadow 0.2s; }
      .cue-btn.ship i { background: rgba(196, 155, 255, 0.45); }
      .cue-btn.warn i { background: rgba(255, 210, 127, 0.55); }
      .cue-btn.fire { border-color: var(--ks-accent); box-shadow: 0 0 14px rgba(127, 212, 255, 0.45); }
      .cue-btn.fire i { background: #fff; box-shadow: 0 0 8px var(--ks-accent); }

      .scope-wrap { position: relative; height: 210px; border-radius: 8px; overflow: hidden; background: rgba(0, 6, 14, 0.55); border: 1px solid rgba(127, 212, 255, 0.12); }
      .scope-wrap::after { content: ''; position: absolute; inset: 0; pointer-events: none;
        background: repeating-linear-gradient(180deg, rgba(255, 255, 255, 0.018) 0 1px, transparent 1px 3px); }
      .captions { position: absolute; left: 0; right: 0; bottom: 10px; display: flex; flex-direction: column; align-items: center; gap: 4px; pointer-events: none; z-index: 2; }
      .caption { font-size: 0.82rem; color: #fff; background: rgba(0, 0, 0, 0.72); padding: 3px 10px; border-radius: 4px; letter-spacing: 0.01em;
        transition: opacity 0.45s ease, transform 0.45s ease; }
      .caption.out { opacity: 0; transform: translateY(4px); }
      .caption.hint { color: var(--ks-dim); background: rgba(0, 0, 0, 0.35); font-size: 0.72rem; }
      .score-wrap { height: 150px; border-radius: 8px; overflow: hidden; background: rgba(0, 6, 14, 0.45); border: 1px solid rgba(196, 155, 255, 0.14); }
      .score-meta { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 7px; font: 0.68rem var(--ks-mono); color: var(--ks-dim); }
      .score-meta b { color: var(--ks-generated); font-weight: 500; }
      .spectro-wrap { height: 170px; border-radius: 8px; overflow: hidden; background: rgba(0, 6, 14, 0.55); border: 1px solid rgba(127, 212, 255, 0.12); }
      .offline-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
      .offline-bar select { font: 0.72rem var(--ks-font); color: var(--ks-fg); background: rgba(8, 18, 34, 0.9); border: 1px solid var(--ks-border); border-radius: 6px; padding: 5px 6px; }
      .stats { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
      .stat { font: 0.66rem var(--ks-mono); color: var(--ks-dim); border: 1px solid rgba(127, 212, 255, 0.18); border-radius: 6px; padding: 4px 7px; }
      .stat b { color: var(--ks-fg); font-weight: 500; margin-left: 5px; }
      .stat.ok b { color: var(--ks-accent); }
      .stat.bad b { color: #ff8a8a; }
      .rule { font-size: 0.74rem; line-height: 1.5; color: var(--ks-dim); margin: 0; }
      .rule strong { color: var(--ks-fg); font-weight: 500; }
      .seed-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px; font-size: 0.75rem; }
      .seed-row input { width: 86px; font: 0.72rem var(--ks-mono); color: var(--ks-fg); background: rgba(8, 18, 34, 0.9); border: 1px solid var(--ks-border); border-radius: 6px; padding: 4px 6px; }
      @media (prefers-reduced-motion: reduce) { .pill.on::before { animation: none; } .caption, .btn-start { transition: none; } }
    </style>
  </head>
  <body class="lab">
    <div id="app" class="lab-wrap"></div>
    <script type="module" src="/src/spike/audioDemo.ts"></script>
  </body>
</html>
