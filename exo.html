<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Known Sky: TRAPPIST-1</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/src/game/styles.css" />
    <style>
      html, body { height: auto; min-height: 100%; overflow-x: hidden; overflow-y: auto; }
      body.lab {
        background:
          radial-gradient(1000px 520px at 18% -10%, rgba(255, 150, 80, 0.10), transparent 60%),
          radial-gradient(900px 520px at 95% 110%, rgba(127, 212, 255, 0.08), transparent 60%),
          var(--ks-bg);
      }
      body.lab::before {
        content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
        background-image:
          linear-gradient(rgba(127, 212, 255, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(127, 212, 255, 0.035) 1px, transparent 1px);
        background-size: 28px 28px;
        -webkit-mask-image: radial-gradient(ellipse at 50% 30%, #000 20%, transparent 75%);
        mask-image: radial-gradient(ellipse at 50% 30%, #000 20%, transparent 75%);
      }
      .lab canvas { display: block; }
      #app { position: relative; z-index: 1; max-width: 1440px; margin: 0 auto; padding: 14px 16px 28px; }
      .loading { color: var(--ks-dim); font: 0.8rem var(--ks-mono); letter-spacing: 0.1em; }
      .loading.error { color: #ff9a9a; }
      .dim { color: var(--ks-dim); }

      .lab-head { display: flex; align-items: center; justify-content: space-between; gap: 12px 18px; margin-bottom: 12px; flex-wrap: wrap; }
      .lab-title { display: flex; align-items: center; gap: 12px; min-width: 0; }
      .lab-mark { width: 34px; height: 34px; flex: none; filter: drop-shadow(0 0 6px rgba(255, 160, 90, 0.45)); }
      .lab-title h1 { margin: 0; font-weight: 300; font-size: 1.15rem; letter-spacing: 0.34em; text-transform: uppercase; white-space: nowrap; }
      .lab-title p { margin: 3px 0 0; color: var(--ks-dim); font-size: 0.76rem; line-height: 1.35; max-width: 62ch; }
      .pills { display: flex; gap: 8px; flex-wrap: wrap; }
      .pill {
        font: 0.66rem var(--ks-mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--ks-dim);
        border: 1px solid var(--ks-border); border-radius: 999px; padding: 5px 11px; display: inline-flex; align-items: center; gap: 7px;
        background: rgba(8, 18, 34, 0.45);
      }
      .pill::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--ks-dim); opacity: 0.6; }
      .pill.on { color: var(--ks-accent); border-color: rgba(127, 212, 255, 0.55); }
      .pill.on::before { background: var(--ks-accent); opacity: 1; box-shadow: 0 0 8px var(--ks-accent); }

      .grid { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
      @media (min-width: 900px) {
        .grid { grid-template-columns: minmax(0, 1fr) minmax(330px, 380px); }
        .col-side { grid-column: 1 / -1; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
      }
      @media (min-width: 1240px) {
        .grid { grid-template-columns: minmax(0, 1fr) 370px 320px; }
        .col-side { grid-column: auto; grid-template-columns: minmax(0, 1fr); }
      }
      .col { display: grid; gap: 12px; align-content: start; min-width: 0; }

      .panel {
        position: relative; overflow: hidden; padding: 10px 12px 12px; border-radius: 10px;
        background: linear-gradient(180deg, rgba(14, 30, 54, 0.62), var(--ks-panel)); border: 1px solid var(--ks-border);
        -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04), 0 10px 30px rgba(0, 0, 0, 0.35);
      }
      .panel::after {
        content: ''; position: absolute; left: 10%; right: 10%; top: 0; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(127, 212, 255, 0.7), transparent);
      }
      .panel h2 {
        display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin: 0 0 8px;
        font: 600 0.64rem var(--ks-mono); letter-spacing: 0.18em; text-transform: uppercase; color: var(--ks-dim);
      }
      .panel h2 .meta { font-weight: 400; letter-spacing: 0.04em; text-transform: none; color: var(--ks-accent); text-align: right; }

      /* Orbits */
      .orbit-wrap { position: relative; border-radius: 8px; overflow: hidden; background: radial-gradient(circle at 50% 50%, rgba(40, 18, 8, 0.55), rgba(0, 6, 14, 0.6) 60%); border: 1px solid rgba(127, 212, 255, 0.12); }
      .orbits { width: 100%; aspect-ratio: 16 / 10; max-height: 62vh; cursor: pointer; }
      .clock { position: absolute; left: 10px; top: 8px; font: 0.7rem var(--ks-mono); color: var(--ks-fg); background: rgba(0, 0, 0, 0.35); padding: 3px 8px; border-radius: 4px; }
      .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
      .chip-btn, .seg button {
        font: 0.72rem var(--ks-font); color: var(--ks-fg); cursor: pointer;
        background: rgba(127, 212, 255, 0.06); border: 1px solid rgba(127, 212, 255, 0.22); border-radius: 6px; padding: 6px 10px;
        transition: background 0.15s ease, border-color 0.15s ease, box-shadow 0.25s ease;
      }
      .chip-btn:hover, .seg button:hover { background: rgba(127, 212, 255, 0.13); border-color: rgba(127, 212, 255, 0.5); }
      .chip-btn[aria-pressed='true'], .seg button[aria-pressed='true'] { background: rgba(127, 212, 255, 0.18); border-color: var(--ks-accent); color: #fff; box-shadow: 0 0 12px rgba(127, 212, 255, 0.28); }
      .seg { display: inline-flex; gap: 4px; margin-left: auto; }
      .foot { margin: 8px 0 0; color: var(--ks-dim); font-size: 0.72rem; line-height: 1.45; }
      button:focus-visible, tr:focus-visible, summary:focus-visible, a:focus-visible { outline: 2px solid var(--ks-accent); outline-offset: 2px; }

      /* Planet table */
      .table-wrap { overflow-x: auto; }
      .ptable { width: 100%; border-collapse: collapse; font-size: 0.76rem; }
      .ptable th { text-align: left; font: 600 0.6rem var(--ks-mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ks-dim); padding: 4px 8px 6px; border-bottom: 1px solid rgba(127, 212, 255, 0.18); white-space: nowrap; }
      .ptable td { padding: 6px 8px; border-bottom: 1px solid rgba(127, 212, 255, 0.07); white-space: nowrap; font-variant-numeric: tabular-nums; }
      .ptable td.m, .ptable td.i { font-family: var(--ks-mono); font-size: 0.72rem; }
      .ptable td.m { border-left: 2px solid transparent; }
      .ptable tbody tr { cursor: pointer; transition: background 0.15s ease; }
      .ptable tbody tr:hover { background: rgba(127, 212, 255, 0.06); }
      .ptable tbody tr.on { background: rgba(127, 212, 255, 0.12); box-shadow: inset 2px 0 0 var(--ks-accent); }
      .ptable .pl b { color: var(--ks-accent); font-family: var(--ks-mono); }
      .ptable .pl .dim { font-size: 0.7rem; }
      .ptable td.i { color: #ffe6b8; }
      .ptable td.g { display: flex; align-items: center; gap: 8px; color: #e6d8ff; }
      .tsw { display: inline-flex; border-radius: 3px; overflow: hidden; outline: 1px solid rgba(196, 155, 255, 0.35); }
      .tsw i { width: 7px; height: 12px; display: block; }
      .legend { display: flex; gap: 14px; margin-top: 8px; font-size: 0.7rem; color: var(--ks-dim); flex-wrap: wrap; }
      .legend > span { display: inline-flex; align-items: center; gap: 6px; }

      /* Provenance marks: shape and line style differ, not only colour. */
      .dot { width: 9px; height: 9px; border-radius: 50%; box-sizing: border-box; display: inline-block; flex: none; border: 2px solid currentColor; }
      .dot-measured { color: var(--ks-measured); background: currentColor; }
      .dot-inferred { color: var(--ks-inferred); border-style: dashed; background: linear-gradient(90deg, currentColor 50%, transparent 50%); }
      .dot-generated { color: var(--ks-generated); border-style: dotted; }
      .exo-prov {
        display: inline-flex; align-items: center; gap: 0.45em; padding: 0.28em 0.55em; border: 1.5px solid currentColor; border-radius: 0.4em;
        background: color-mix(in srgb, currentColor 12%, transparent); font: 700 0.6rem/1 var(--ks-mono); letter-spacing: 0.12em; text-transform: uppercase;
      }
      .exo-prov-mark { width: 0.75em; height: 0.75em; box-sizing: border-box; border: 2px solid currentColor; border-radius: 50%; }
      .exo-prov-measured { color: var(--ks-measured); border-style: solid; }
      .exo-prov-measured .exo-prov-mark { background: currentColor; }
      .exo-prov-inferred { color: var(--ks-inferred); border-style: dashed; }
      .exo-prov-inferred .exo-prov-mark { background: linear-gradient(90deg, currentColor 50%, transparent 50%); }
      .exo-prov-generated { color: var(--ks-generated); border-style: dotted; }
      .exo-prov-generated .exo-prov-mark { border-style: dotted; }

      /* Planet card */
      .pc-head h3 { margin: 0; font-weight: 300; font-size: 1.3rem; letter-spacing: 0.12em; }
      .pc-head p { margin: 2px 0 8px; font-size: 0.7rem; }
      .pc-top { display: grid; grid-template-columns: 132px minmax(0, 1fr); gap: 10px; align-items: start; margin-bottom: 10px; }
      .preview-fig { margin: 0; }
      .preview { width: 132px; height: 132px; filter: drop-shadow(0 0 14px rgba(255, 140, 70, 0.18)); }
      .preview-fig figcaption { margin-top: 6px; font-size: 0.62rem; line-height: 1.4; color: #cdb8f5; font-style: italic; }
      .sec { border-radius: 8px; padding: 6px 8px 4px; margin-bottom: 8px; background: rgba(2, 8, 18, 0.35); }
      .sec-measured { border: 1px solid rgba(127, 212, 255, 0.28); }
      .sec-inferred { border: 1px dashed rgba(255, 210, 127, 0.35); }
      .sec-generated { border: 1px dotted rgba(196, 155, 255, 0.55); }
      .pc-gen .sec { margin-bottom: 6px; }
      .pc-gen .sec-cap { display: none; }
      .sec-head { display: flex; align-items: center; gap: 8px; margin: 0 0 4px; }
      .sec-cap { font-size: 0.64rem; color: var(--ks-dim); line-height: 1.25; }
      .vrow {
        display: grid; grid-template-columns: minmax(0, 1fr) auto 9px; gap: 8px; align-items: center; width: 100%;
        background: none; border: 0; border-radius: 5px; padding: 3px 4px; color: var(--ks-fg); cursor: pointer; text-align: left;
        font: 0.72rem var(--ks-font);
      }
      .vrow .k { color: var(--ks-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .vrow .v { font: 0.7rem var(--ks-mono); text-align: right; font-variant-numeric: tabular-nums; }
      .vrow:hover { background: rgba(127, 212, 255, 0.07); }
      .vrow.on { background: rgba(127, 212, 255, 0.14); box-shadow: inset 2px 0 0 var(--ks-accent); }
      .vrow.on .k { color: var(--ks-fg); }
      .sw-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 4px; font-size: 0.72rem; }
      .sw-row .k { color: var(--ks-dim); }
      .swatches { display: inline-flex; border-radius: 4px; overflow: hidden; outline: 1px solid rgba(196, 155, 255, 0.4); }
      .swatches i { width: 18px; height: 14px; display: block; }
      .why { margin-top: 6px; padding: 0 4px; font-size: 0.7rem; }
      .why summary { cursor: pointer; color: var(--ks-generated); font: 600 0.62rem var(--ks-mono); letter-spacing: 0.12em; text-transform: uppercase; }
      .why p { margin: 6px 0 0; color: var(--ks-fg); line-height: 1.5; }

      /* How do we know this? */
      .detail-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      .detail-head strong { font-weight: 500; font-size: 0.86rem; }
      .detail-value { margin: 6px 0 8px; font: 0.95rem var(--ks-mono); color: #fff; text-shadow: 0 0 12px rgba(127, 212, 255, 0.35); word-break: break-word; }
      .detail dl { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 5px 10px; font-size: 0.72rem; line-height: 1.45; }
      .detail dt { color: var(--ks-dim); font: 600 0.6rem/1.9 var(--ks-mono); letter-spacing: 0.1em; text-transform: uppercase; }
      .detail dd { margin: 0; color: var(--ks-fg); }
      .detail a { color: var(--ks-accent); }
      .detail code { font: 0.68rem var(--ks-mono); color: var(--ks-accent); }
      .rows { display: grid; gap: 1px; }
      @media (prefers-reduced-motion: reduce) { .chip-btn, .seg button, .ptable tbody tr { transition: none; } }
    </style>
  </head>
  <body class="lab">
    <main id="app"></main>
    <script type="module" src="/src/spike/exoDemo.ts"></script>
  </body>
</html>
