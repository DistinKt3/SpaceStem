<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Known Sky: Fuel Lab</title>
    <link rel="icon" href="data:," />
    <style>
      /* styles.css (imported by the script, so injected later) locks the game page; this lab page scrolls. */
      html[lang], body.lab { height: auto; min-height: 100%; overflow-x: hidden; overflow-y: auto; }
      body.lab {
        background:
          radial-gradient(70rem 32rem at 75% -12%, rgba(255, 190, 120, 0.08), transparent 62%),
          radial-gradient(56rem 32rem at -12% 112%, rgba(127, 212, 255, 0.08), transparent 60%),
          var(--ks-bg);
      }
      body.lab::before {
        content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
        background-image:
          linear-gradient(rgba(127, 212, 255, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(127, 212, 255, 0.035) 1px, transparent 1px);
        background-size: 1.75rem 1.75rem;
        -webkit-mask-image: radial-gradient(ellipse at 50% 30%, #000 20%, transparent 75%);
        mask-image: radial-gradient(ellipse at 50% 30%, #000 20%, transparent 75%);
      }
      .lab canvas { display: block; width: 100%; height: 100%; }
      /* Container queries (not media queries) so the layout follows the text-scale setting: rem here is the root size. */
      .lab-wrap { position: relative; z-index: 1; max-width: 86rem; margin: 0 auto; padding: 0.9rem 1rem 1.8rem; container-type: inline-size; }

      .lab-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 0.8rem; flex-wrap: wrap; }
      .lab-title { display: flex; align-items: center; gap: 0.75rem; min-width: 0; flex: 1 1 22rem; }
      .lab-mark { width: 1.9rem; height: 1.9rem; flex: none; color: var(--ks-accent); }
      .lab-title h1 { margin: 0; font-weight: 300; font-size: 1.05rem; letter-spacing: 0.32em; text-transform: uppercase; }
      .lab-title h1 .accent { color: var(--ks-accent); }
      .lab-title p { margin: 0.15rem 0 0; color: var(--ks-dim); font-size: 0.74rem; line-height: 1.4; max-width: 46rem; }
      .lab-actions { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
      .pill {
        font: 0.64rem var(--ks-mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ks-dim); white-space: nowrap;
        border: 1px dotted var(--ks-dim); border-radius: 999px; padding: 0.3rem 0.7rem;
      }
      .simtime { font: 0.68rem var(--ks-mono); color: var(--ks-dim); font-variant-numeric: tabular-nums; min-width: 7.5rem; text-align: right; }

      .grid { display: grid; gap: 0.75rem; grid-template-columns: minmax(0, 1fr); grid-template-areas: 'preview' 'controls' 'charts'; }
      @container (min-width: 48rem) {
        .grid { grid-template-columns: 17rem minmax(0, 1fr); grid-template-areas: 'controls preview' 'charts charts'; align-items: start; }
      }
      @container (min-width: 76rem) {
        .grid { grid-template-columns: 17rem minmax(0, 1.05fr) minmax(0, 1fr); grid-template-areas: 'controls preview charts'; }
      }
      .col { display: grid; gap: 0.75rem; align-content: start; min-width: 0; }
      .col-controls { grid-area: controls; }
      .col-preview { grid-area: preview; }
      .col-charts { grid-area: charts; }

      .panel {
        position: relative; padding: 0.65rem 0.75rem 0.75rem; border-radius: 0.65rem; min-width: 0;
        background: linear-gradient(180deg, rgba(14, 30, 54, 0.62), var(--ks-panel)); border: var(--ks-border-w, 1px) solid var(--ks-border);
        -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04), 0 0.6rem 1.9rem rgba(0, 0, 0, 0.35);
      }
      .panel::after {
        content: ''; position: absolute; left: 10%; right: 10%; top: 0; height: 1px; pointer-events: none;
        background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--ks-accent) 70%, transparent), transparent);
      }
      .panel h2 {
        display: flex; justify-content: space-between; align-items: baseline; gap: 0.5rem; margin: 0 0 0.5rem;
        font: 600 0.64rem var(--ks-mono); letter-spacing: 0.18em; text-transform: uppercase; color: var(--ks-dim);
      }
      .panel h2 .meta { font-weight: 400; letter-spacing: 0.04em; text-transform: none; color: var(--ks-fg); }
      .panel .note { margin: 0.4rem 0 0; font-size: 0.68rem; line-height: 1.45; color: var(--ks-dim); }

      .ctl { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 0.2rem 0.5rem; margin: 0.1rem 0 0.65rem; }
      .ctl label { font-size: 0.76rem; color: var(--ks-fg); }
      .ctl output { font: 0.7rem var(--ks-mono); color: var(--ks-accent); text-align: right; }
      .ctl input[type='range'] { grid-column: 1 / -1; }
      .ctl .hint { grid-column: 1 / -1; font: 0.64rem var(--ks-mono); color: var(--ks-dim); }
      input[type='range'] {
        -webkit-appearance: none; appearance: none; width: 100%; height: 1.1rem; margin: 0; background: transparent; cursor: pointer; --p: 0%;
      }
      input[type='range']::-webkit-slider-runnable-track {
        height: 0.2rem; border-radius: 0.2rem;
        background: linear-gradient(90deg, var(--ks-accent) 0, var(--ks-accent) var(--p), rgba(138, 160, 192, 0.25) var(--p));
      }
      input[type='range']::-moz-range-track { height: 0.2rem; border-radius: 0.2rem; background: rgba(138, 160, 192, 0.25); }
      input[type='range']::-moz-range-progress { height: 0.2rem; border-radius: 0.2rem; background: var(--ks-accent); }
      input[type='range']::-webkit-slider-thumb {
        -webkit-appearance: none; width: 0.8rem; height: 0.8rem; margin-top: -0.3rem; border-radius: 50%;
        background: #e8f7ff; border: 2px solid var(--ks-accent); box-shadow: 0 0 0.6rem color-mix(in srgb, var(--ks-accent) 70%, transparent);
      }
      input[type='range']::-moz-range-thumb { width: 0.65rem; height: 0.65rem; border-radius: 50%; background: #e8f7ff; border: 2px solid var(--ks-accent); }
      input:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid var(--ks-focus, var(--ks-accent)); outline-offset: 2px; }

      .btns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.35rem; }
      .btns.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .btn {
        font: 0.7rem var(--ks-font); color: var(--ks-fg); cursor: pointer; text-align: center; min-height: 1.9rem;
        background: rgba(127, 212, 255, 0.05); border: 1px solid rgba(127, 212, 255, 0.2); border-radius: 0.4rem; padding: 0.35rem 0.5rem;
        transition: background 0.15s ease, border-color 0.15s ease;
      }
      .btn:hover { background: rgba(127, 212, 255, 0.12); border-color: color-mix(in srgb, var(--ks-accent) 60%, transparent); }
      .btn[aria-pressed='true'] { background: rgba(127, 212, 255, 0.18); border-color: var(--ks-accent); color: #fff; }
      .btn.primary {
        font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #02121c; border: 0;
        background: linear-gradient(180deg, #a6e4ff, var(--ks-accent));
        box-shadow: 0 0 0 1px rgba(127, 212, 255, 0.5), 0 0 1.2rem rgba(127, 212, 255, 0.35);
      }
      .btn.primary:hover { filter: brightness(1.08); }
      .btn kbd {
        display: inline-block; margin-left: 0.2rem; min-width: 1.1rem; font: 600 0.66rem/1.35 var(--ks-mono); letter-spacing: 0;
        padding: 0 0.3rem; border-radius: 0.22rem; background: rgba(2, 18, 28, 0.12); border: 1px solid rgba(2, 18, 28, 0.4); border-bottom-width: 2px;
      }
      .sub-h { margin: 0.7rem 0 0.35rem; font: 600 0.6rem var(--ks-mono); letter-spacing: 0.16em; text-transform: uppercase; color: var(--ks-dim); }
      .star-stats { font: 0.64rem var(--ks-mono); color: var(--ks-dim); grid-column: 1 / -1; }
      .flash { min-height: 1.1rem; margin-top: 0.45rem; font-size: 0.7rem; color: var(--ks-fg); }
      .flash.bad { color: var(--ks-fg); }
      .flash.bad::before { content: '\2715\00a0'; color: var(--ks-danger); font-weight: 700; }

      /* The gauge is in flow at the top-right, so the drawing grows with it at large text instead of clipping it. */
      .preview {
        position: relative; display: flex; justify-content: flex-end; align-items: flex-start; box-sizing: border-box;
        min-height: 15.5rem; padding: 0.75rem; border-radius: 0.5rem; overflow: hidden; background: #01030a; border: 1px solid rgba(127, 212, 255, 0.14);
      }
      .preview canvas { position: absolute; inset: 0; }
      .preview .ks-fuel { flex: 0 1 auto; }
      .preview-note { margin: 0.4rem 0 0; font: 0.62rem/1.4 var(--ks-mono); color: var(--ks-dim); }

      .readouts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.5rem 0.9rem; }
      @container (max-width: 30rem) { .readouts { grid-template-columns: minmax(0, 1fr); } }
      .ro .k { font: 0.58rem var(--ks-mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ks-dim); }
      .ro .v { font-size: 0.86rem; font-weight: 600; margin-top: 0.1rem; }
      .ro .s { font: 0.62rem var(--ks-mono); color: var(--ks-dim); margin-top: 0.05rem; }
      .ro[data-band='in'] .v::before { content: '\25CF\00a0'; color: var(--ks-ok); }
      .ro[data-band='out'] .v::before { content: '\25CB\00a0'; color: var(--ks-dim); }

      .log { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.2rem; align-content: start; font-size: 0.72rem; min-height: 5.5rem; }
      .log li { display: grid; grid-template-columns: 4.2rem 1fr; gap: 0.4rem; align-items: baseline; }
      .log li time { font: 0.64rem var(--ks-mono); color: var(--ks-dim); font-variant-numeric: tabular-nums; }
      .log li[data-kind='warn'] span::before { content: '\25B2\00a0'; color: var(--ks-warn); }
      .log li[data-kind='danger'] span::before { content: '\25C6\00a0'; color: var(--ks-danger); }
      .log li[data-kind='ok'] span::before { content: '\25CF\00a0'; color: var(--ks-ok); }
      .log li[data-kind='info'] span::before { content: '\25CB\00a0'; color: var(--ks-accent); }
      .log li.empty { display: block; color: var(--ks-dim); }

      .chart { position: relative; height: 9.6rem; }
      .chart canvas { position: absolute; inset: 0; touch-action: none; cursor: crosshair; }
      .chart-sub { font: 0.62rem var(--ks-mono); color: var(--ks-dim); margin: -0.3rem 0 0.35rem; }
      .tip {
        position: absolute; z-index: 3; pointer-events: none; display: none; min-width: 8rem; padding: 0.35rem 0.5rem; border-radius: 0.35rem;
        background: rgba(4, 10, 22, 0.94); border: 1px solid var(--ks-border); font: 0.66rem/1.45 var(--ks-mono); color: var(--ks-dim);
        box-shadow: 0 0.4rem 1.2rem rgba(0, 0, 0, 0.45);
      }
      .tip b { color: var(--ks-fg); font-weight: 600; }
      .tip .row { display: flex; align-items: center; gap: 0.35rem; white-space: nowrap; }
      .tip .key { width: 0.7rem; height: 2px; background: var(--ks-accent); flex: none; }
      details.table { margin-top: 0.1rem; }
      details.table summary { cursor: pointer; font: 600 0.62rem var(--ks-mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ks-dim); }
      details.table table { width: 100%; margin-top: 0.4rem; border-collapse: collapse; font: 0.66rem var(--ks-mono); font-variant-numeric: tabular-nums; }
      details.table th, details.table td { padding: 0.18rem 0.3rem; text-align: right; border-bottom: 1px solid rgba(255, 255, 255, 0.06); }
      details.table th { color: var(--ks-dim); font-weight: 400; }
      details.table tr[data-band='in'] td:first-child::before { content: '\25CF\00a0'; color: var(--ks-ok); }
      .sources { margin: 0; padding-left: 1rem; font-size: 0.66rem; line-height: 1.5; color: var(--ks-dim); }
      @media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
      :root[data-reduced-motion='true'] .btn { transition: none; }
    </style>
  </head>
  <body class="lab">
    <div id="app" class="lab-wrap"></div>
    <script type="module" src="/src/spike/fuelDemo.ts"></script>
  </body>
</html>
